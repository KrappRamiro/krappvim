name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # lint (stylua, selene, nixfmt) + smoke test de arranque
      - run: nix flake check --print-build-logs
